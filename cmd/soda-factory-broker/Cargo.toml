[package]
name = "soda-factory-broker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Root-owned bounded Factory run bundle and preparation boundary"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
soda-execution-protocol = { path = "../../lib/execution-protocol" }
soda-native-process = { path = "../../lib/native-process" }
