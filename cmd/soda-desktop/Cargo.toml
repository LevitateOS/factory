[package]
name = "soda-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
native-ui = ["dep:tauri", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-opener", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
native-check = ["native-ui"]

[[bin]]
name = "soda-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[[bin]]
name = "factory-dev"
path = "src/developer_cli.rs"

[dependencies]
soda-desktop-runtime = { path = "../../lib/desktop-runtime" }
soda-unix-http = { path = "../../lib/unix-http" }
libc = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
http-body-util = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true, optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }
tauri-plugin-opener = { version = "=2.7.3", optional = true }
tokio = { workspace = true, default-features = true, features = ["time", "net", "sync", "macros", "rt", "io-util"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"], optional = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }
