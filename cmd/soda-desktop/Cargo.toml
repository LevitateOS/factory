[package]
name = "soda-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
native-ui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-opener", "dep:tokio"]
native-check = ["native-ui", "dep:soda-unix-http"]

[[bin]]
name = "soda-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[dependencies]
soda-desktop-runtime = { path = "../../lib/desktop-runtime" }
soda-unix-http = { path = "../../lib/unix-http", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }
tauri-plugin-opener = { version = "=2.7.2", optional = true }
tokio = { version = "=1.54.1", features = ["time"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }
