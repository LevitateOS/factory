[package]
name = "soda-factory-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Isolated Factory worker socket boundary"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["io-util", "macros", "net", "rt", "time"] }
soda-native-process = { path = "../../lib/native-process" }
soda-execution-protocol = { path = "../../lib/execution-protocol" }
