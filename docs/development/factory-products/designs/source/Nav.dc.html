renderVals() {
var cur = this.props.current ?? 'feed';
function mk(id, label, href) { return { label: label, href: href, on: cur === id, off: cur !== id }; }
return {
allOn: cur === 'projects',
allOff: cur !== 'projects',
items: [
mk('feed', 'Feed', 'Main.dc.html'),
mk('request', 'Request', 'Request.dc.html'),
mk('work', 'Work', 'Work.dc.html'),
mk('issues', 'Issues', 'Issues.dc.html'),

],
foot: [

]
};
}
}
