[package]
name = "soda-unix-http"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Bounded HTTP/1 transport for existing private Unix clients"

[dependencies]
bytes = "=1.12.1"
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, default-features = false, features = ["rt", "net", "time"] }
