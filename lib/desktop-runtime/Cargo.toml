[package]
name = "soda-desktop-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Native Factory desktop process and storage lifecycle"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
getrandom = { version = "=0.4.3", features = ["std"] }
url = "=2.5.8"
serde_json = "=1.0.154"
soda-unix-http = { path = "../unix-http" }
serde = { version = "=1.0.229", features = ["derive"] }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "net", "macros"] }
zeroize = "=1.9.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
time = { version = "=0.3.55", features = ["parsing"] }
diffy = "=0.5.2"
sha2 = "=0.11.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
