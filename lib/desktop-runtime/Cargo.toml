[package]
name = "soda-desktop-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Native Factory desktop process and storage lifecycle"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
url = { workspace = true }
serde_json = { workspace = true }
soda-unix-http = { path = "../unix-http" }
serde = { workspace = true, features = ["derive"] }
secret-service = { workspace = true, features = ["rt-tokio-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { workspace = true, default-features = true, features = ["sync", "time", "rt", "net", "macros", "io-util", "fs"] }
zeroize = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
time = { version = "=0.3.55", features = ["parsing"] }
diffy = "=0.5.2"
sha2 = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
soda-execution-protocol = { path = "../execution-protocol" }
base64 = "=0.23.1"
