[package]
name = "soda-native-process"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Headless native process and process-tree lifetime primitive"

[target.'cfg(unix)'.dependencies]
soda-parent-death = { path = "../parent-death" }
libc = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
zeroize = { workspace = true }
soda-execution-protocol = { path = "../execution-protocol" }
