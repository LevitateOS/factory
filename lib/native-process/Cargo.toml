[package]
name = "soda-native-process"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Headless Linux native process and cgroup lifetime primitive"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
zeroize = { workspace = true }
soda-execution-protocol = { path = "../execution-protocol" }
