[package]
name = "factory-native-checks"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
getrandom = "=0.4.3"
hmac = "=0.13.0"
sha2 = "=0.11.1"
soda-unix-http = { path = "../../lib/unix-http" }
base64 = "=0.22.1"
libc = "=0.2.191"
url = "=2.5.8"
soda-desktop-runtime = { path = "../../lib/desktop-runtime" }
serde_json = "=1.0.154"
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
