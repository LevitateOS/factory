[package]
name = "soda-factory-ui"
version = "0.1.0"
edition = "2021"

[features]
default = []
native-ui = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "soda-factory-ui"
path = "src/main.rs"
required-features = ["native-ui"]

[dependencies]
tauri = { workspace = true, features = [], optional = true }
serde_json.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [], optional = true }
