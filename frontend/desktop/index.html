<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="factory.css" />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <header class="desktop-toolbar">
      <p id="runtime-status" role="status">Opening Factory…</p>
      <nav aria-label="Application">
        <button id="refresh" type="button">Refresh</button>
        <button id="retry" type="button" hidden>Retry startup</button>
        <button id="new-window" type="button">New window</button>
        <button id="close" type="button">Close window</button>
        <button id="quit" type="button">Quit Factory</button>
      </nav>
    </header>
    <section class="desktop-accounts" aria-labelledby="muse-heading">
      <h1 id="muse-heading">Muse</h1>
      <p id="muse-status" role="status">Checking Muse sign-in…</p>
      <button id="muse-sign-in" type="button" disabled>Sign in to Muse</button>
      <div id="muse-prompt" hidden>
        <p>Confirm this code on Meta:</p>
        <code id="muse-user-code" tabindex="0" aria-label="Muse verification code"></code>
        <button id="muse-open" type="button">Open Meta</button>
      </div>
      <button id="muse-cancel" type="button" hidden>Cancel sign-in</button>
    </section>
    <section class="desktop-accounts" aria-labelledby="github-heading">
      <h1 id="github-heading">GitHub</h1>
      <p id="github-status" role="status">Opening saved accounts…</p>
      <button id="github-sign-in" type="button" disabled>Sign in to GitHub</button>
      <div id="github-prompt" hidden>
        <p>Enter this code at <span>github.com/login/device</span>:</p>
        <code id="github-user-code" tabindex="0" aria-label="GitHub verification code"></code>
        <p id="github-expiry"></p>
        <p>GitHub will ask for repository and profile access.</p>
        <button id="github-open" type="button">Open GitHub</button>
      </div>
      <button id="github-cancel" type="button" hidden>Cancel sign-in</button>
      <ul id="github-accounts" aria-label="Saved GitHub accounts"></ul>
    </section>
    <section class="desktop-connections" aria-label="Factory connection">
      <label
        >Account
        <select id="factory-account" disabled>
          <option value="">Choose an account</option>
        </select></label
      >
      <label
        >Repository
        <select id="factory-repository" disabled>
          <option value="">Choose a repository</option>
        </select></label
      >
      <button id="repository-more" type="button" hidden>Load more repositories</button>
      <button id="connection-reconnect" type="button" disabled>Reconnect</button>
      <button id="connection-disconnect" type="button" disabled>Disconnect</button>
      <form id="repository-find">
        <label
          >GitHub repository
          <input id="repository-name" placeholder="owner/name or GitHub URL" autocomplete="off" disabled
        /></label>
        <button type="submit" disabled>Open repository</button>
      </form>
      <p id="connection-status" role="status">Choose a saved account to connect.</p>
      <section id="runtime-placement" aria-label="Execution controller" hidden></section>
      <p>Execution is unavailable.</p>
    </section>
    <div id="application"></div>
    <script type="module" src="desktop.js"></script>
  </body>
</html>
