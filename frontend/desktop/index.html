<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="factory.css" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <!-- Shown only while Factory starts or when it needs a retry. -->
    <div id="desktop-notices">
      <p id="runtime-status" role="status">Opening Factory…</p>
      <button id="retry" type="button" hidden>Retry startup</button>
    </div>
    <section id="sign-in" class="soda-factory-root soda-factory-accounts" aria-label="Set up Factory"></section>
    <!-- Placed by the sign-in placement: Projects' "Add a project" card, or setup's last step. -->
    <div id="connection-panel" class="desktop-connections">
      <label
        >Account
        <select id="factory-account" disabled>
          <option value="">Choose an account</option>
        </select></label
      >
      <!-- One combobox: type to filter your repositories, pick one, or enter owner/name or a URL. -->
      <form id="repository-find">
        <label
          >Repository
          <input
            id="repository-name"
            list="repository-options"
            placeholder="Search your repositories, or owner/name or URL"
            autocomplete="off"
            spellcheck="false"
            disabled
        /></label>
        <datalist id="repository-options"></datalist>
        <button type="submit" disabled>Open</button>
      </form>
      <button id="repository-more" type="button" hidden>Load more repositories</button>
      <p id="connection-status" role="status">Choose a saved account to connect.</p>
      <div class="desktop-connections-actions">
        <button id="connection-reconnect" type="button" disabled>Reconnect</button>
        <button id="connection-disconnect" type="button" disabled>Disconnect</button>
      </div>
    </div>
    <div id="application"></div>
    <script type="module" src="desktop.js"></script>
  </body>
</html>
